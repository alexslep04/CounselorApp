<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Suggestion Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            width: 1600px; /* Increased the total width */
            height: 800px;
            gap: 20px; /* Add gap between the chat and job containers */
        }

        .chat-container,
        .job-container {
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 2.5; /* Increased flex value to make it wider */
            border-right: 1px solid #ccc;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .message.user {
            background-color: #e1ffc7;
            text-align: right;
        }

        .message.bot {
            background-color: #f1f1f1;
        }

        .input-container {
            display: flex;
            margin-bottom: 20px;
        }

        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
        }

        .input-container button {
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
        }

        .input-container button:hover {
            background-color: #0056b3;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .start-button,
        .stop-session-button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin: 0 10px;
        }

        .start-button {
            background-color: #28a745;
            color: #fff;
        }

        .start-button:hover {
            background-color: #218838;
        }

        .stop-session-button {
            background-color: #dc3545;
            color: #fff;
        }

        .stop-session-button:hover {
            background-color: #c82333;
        }

        .job-container {
            flex: 1; /* Reduced flex value to make it narrower */
            display: none; /* Hide the job container by default */
            flex-direction: column;
        }

        .job-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px; /* Increased margin to create a larger gap */
            text-align: left;
        }

        .job-row {
            display: grid;
            grid-template-columns: 50px 1fr 150px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ccc;
        }

        .checkbox-container,
        .job-label-container,
        .more-info-button-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .job-label-container {
            justify-content: flex-start;
            padding-left: 10px;
        }

        .test-buttons {
            margin-top: 30px; /* Increased margin to create a larger gap */
        }

        .loading-spinner {
            border: 8px solid #c8c4c4; /*spinner color maybe changhe for nicholas*/
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite; 
            position: absolute;
            top: 50%;
            left: 50%;
            margin: -25px 0 0 -25px;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .test-buttons button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .generate-test-button {
            background-color: #ffc107;
            color: #000;
        }

        .generate-test-button:hover {
            background-color: #e0a800;
        }

        .regenerate-jobs-button {
            background-color: #17a2b8;
            color: #fff;
        }

        .regenerate-jobs-button:hover {
            background-color: #138496;
        }

        .save-preferences-button {
            background-color: #6c757d;
            color: #fff;
        }

        .save-preferences-button:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="chat-container">
            <div class="title">Career Coach ver. 0.1</div>
            <div class="button-container">
                <button class="start-button" onclick="startSession()" id="startButton">Start Session</button>
                <button class="stop-session-button" onclick="stopSession()" id="stopSessionButton">End Session</button>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message here..." disabled
                    onkeydown="checkEnter(event)">
                <button onclick="sendMessage()" disabled id="sendButton">Send</button>
            </div>
        </div>
        <div class="job-container" id="jobContainer">
            <div class="job-title">Click 'More Info' to learn additional details about each job.<br><br> Select the 2-3 jobs that interest you the most, and then click 'Help Me Choose' to continue.</div>
            <div id="jobGrid"></div>
            <div class="test-buttons">
                <button class="generate-test-button" onclick="generatePersonalizedTest()" disabled
                    id="generateTestButton">Help Me Choose</button>
                <button class="regenerate-jobs-button" onclick="regenerateUncheckedJobs()" disabled
                    id="regenerateJobsButton" style="display:none;">Regenerate Unchecked Jobs</button>
                <button class="save-preferences-button" onclick="saveJobPreferences()" disabled
                    id="savePreferencesButton" style="display:none;">Save Job Preferences</button>
            </div>
        </div>
        <div class="loading-spinner" id="loadingSpinner"></div>
    </div>
    <script>
        let userId = Math.random().toString(36).substring(7);

        let isApiProcessing = false;

        function toggleInputs(disabled) {
            document.getElementById('userInput').disabled = disabled;
            document.getElementById('sendButton').disabled = disabled;
            document.getElementById('startButton').disabled = disabled;
            document.getElementById('generateTestButton').disabled = disabled;
            document.getElementById('regenerateJobsButton').disabled = disabled;
            document.getElementById('savePreferencesButton').disabled = disabled;
            document.getElementById('stopSessionButton').disabled = disabled;
        }

        function toggleLoadingSpinner(show) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            loadingSpinner.style.display = show ? 'block' : 'none';
        }

        async function startSession() {
            toggleLoadingSpinner(true);
            toggleInputs(true);

            const response = await fetch('/start_session', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId })
            });

            toggleLoadingSpinner(false);
            toggleInputs(false);

            const data = await response.json();
            addMessage(data.message, 'bot');
            document.getElementById('startButton').disabled = true;
            document.getElementById('userInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
        }

        function stopSession() {
            toggleLoadingSpinner(true);
            toggleInputs(true);
            isApiProcessing = true;

            // Call the API to stop the session
            fetch('/stop_session', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId })
            }).then(response => {
                toggleLoadingSpinner(false);
                toggleInputs(false);
                isApiProcessing = false;
                // Handle response if needed
            }).catch(error => {
                console.error('Error stopping session:', error);
                toggleLoadingSpinner(false);
                toggleInputs(false);
                isApiProcessing = false;
            });
        }

        async function regenerateUncheckedJobs() {
            if (isApiProcessing) return;

            toggleInputs(true);
            isApiProcessing = true;

            const checkboxes = document.querySelectorAll('.job-checkbox');
            const checkedJobs = Array.from(checkboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);

            const uncheckedJobs = Array.from(checkboxes)
                .filter(checkbox => !checkbox.checked)
                .map(checkbox => checkbox.value);

            const response = await fetch('/regenerate_unchecked_jobs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId, checked_jobs: checkedJobs, unchecked_jobs: uncheckedJobs })
            });

            const data = await response.json();
            displayJobGrid(data.message);

            toggleInputs(false);
            isApiProcessing = false;
        }

        async function sendMessage() {
            if (isApiProcessing) {
                return;
            }

            const userInput = document.getElementById('userInput').value;
            if (!userInput) return;

            addMessage(userInput, 'user');
            document.getElementById('userInput').value = '';

            toggleLoadingSpinner(true);
            toggleInputs(true);
            isApiProcessing = true;

            const response = await fetch('/next_step', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId, input: userInput })
            });

            toggleLoadingSpinner(false);
            toggleInputs(false);
            isApiProcessing = false;

            const data = await response.json();
            addMessage(data.message, 'bot');

            if (data.message.includes("here are some job suggestions")) {
                displayJobGrid(data.message);
            }

            // Put focus back to the input field
            document.getElementById('userInput').focus();
        }

        async function generatePersonalizedTest() {
            if (isApiProcessing) return;

            const checkboxes = document.querySelectorAll('.job-checkbox:checked');
            const selectedJobs = Array.from(checkboxes).map(checkbox => checkbox.value);

            addMessage(`Help me choose between the selected jobs`, 'user');

            toggleLoadingSpinner(true);
            toggleInputs(true);
            isApiProcessing = true;

            const response = await fetch('/generate_personalized_test', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user_id: userId,
                    jobs: selectedJobs,
                    prompt: "I am looking for a new job, create a specifically tailored personality test to decide what job would suit me better."
                })
            });

            toggleLoadingSpinner(false);
            toggleInputs(false);
            isApiProcessing = false;

            const data = await response.json();
            addMessage(`${data.test}`, 'bot');

            // Enable inputs to allow the user to submit test answers
            document.getElementById('userInput').disabled = false;
            document.getElementById('sendButton').disabled = false;

            // Save the test questions to session data
            sessionStorage.setItem('personalityTest', data.test);
        }

        async function saveJobPreferences() {
            if (isApiProcessing) return;

            const checkboxes = document.querySelectorAll('.job-checkbox:checked');
            const preferences = Array.from(checkboxes)
                .map(checkbox => checkbox.value)
                .join(', ');

            toggleLoadingSpinner(true);
            toggleInputs(true);
            isApiProcessing = true;

            const response = await fetch('/job_preferences', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId, preferences: preferences })
            });

            toggleLoadingSpinner(false);
            toggleInputs(false);
            isApiProcessing = false;

            const data = await response.json();
            addMessage(data.message, 'bot');
        }

        function addMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${sender}`;
            messageElement.innerText = message;
            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function displayJobGrid(message) {
            const jobContainer = document.getElementById('jobContainer');
            jobContainer.style.display = 'flex'; // Make the job container visible

            const jobGrid = document.getElementById('jobGrid');
            jobGrid.innerHTML = '';

            // Remove the introductory message and keep only job suggestions
            const jobSuggestions = message.split('\n').slice(2).join('\n');

            const jobRegex = /(?:^\d+\.\s)?(.+?)\:\s*(.+)$/gm;
            let match;
            const jobs = [];

            while ((match = jobRegex.exec(jobSuggestions)) !== null) {
                jobs.push({ title: match[1], description: match[2] });
            }

            jobs.forEach(job => {
                const jobRow = document.createElement('div');
                jobRow.classList.add('job-row');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `job-${job.title}`;
                checkbox.value = job.title;
                checkbox.className = 'job-checkbox';
                checkbox.onchange = limitCheckedBoxes;

                const jobLabel = document.createElement('label');
                jobLabel.setAttribute('for', `job-${job.title}`);
                jobLabel.innerText = job.title;

                const moreInfoButton = document.createElement('button');
                moreInfoButton.innerText = 'More Info';
                moreInfoButton.onclick = () => generateMoreInfo(job.title);

                const checkboxContainer = document.createElement('div');
                checkboxContainer.classList.add('checkbox-container');
                checkboxContainer.appendChild(checkbox);

                const jobLabelContainer = document.createElement('div');
                jobLabelContainer.classList.add('job-label-container');
                jobLabelContainer.appendChild(jobLabel);

                const moreInfoButtonContainer = document.createElement('div');
                moreInfoButtonContainer.classList.add('more-info-button-container');
                moreInfoButtonContainer.appendChild(moreInfoButton);

                jobRow.appendChild(checkboxContainer);
                jobRow.appendChild(jobLabelContainer);
                jobRow.appendChild(moreInfoButtonContainer);

                jobGrid.appendChild(jobRow);
            });

            document.getElementById('generateTestButton').disabled = false;
            document.getElementById('regenerateJobsButton').disabled = false;
        }

        function limitCheckedBoxes() {
            const checkboxes = document.querySelectorAll('.job-checkbox');
            const checkedCheckboxes = Array.from(checkboxes).filter(checkbox => checkbox.checked);

            if (checkedCheckboxes.length > 3) {
                alert("You can only select up to 3 jobs.");
                this.checked = false;
            }
        }

        async function generateMoreInfo(job) {
            toggleLoadingSpinner(true);

            // Add the message to the chat box
            addMessage(`Tell me more about being a ${job}`, 'user');

            const response = await fetch('/generate_more_info', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ user_id: userId, job: job })
            });

            toggleLoadingSpinner(false);

            const data = await response.json();
            addMessage(`${data.info}`, 'bot');
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>

</html>
